<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nina — FisiovetClass</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #e5ddd5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 12px;
  }
  .phone {
    width: 100%;
    max-width: 420px;
    height: 90vh;
    max-height: 780px;
    background: #fff;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .header {
    background: #075e54;
    color: #fff;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .back-btn { font-size: 20px; opacity: .85; cursor: pointer; }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .header-info { flex: 1 }
  .header-name { font-weight: 600; font-size: 16px; }
  .header-status { font-size: 12px; color: #b2dfdb; }
  .header-icons { display: flex; gap: 16px; font-size: 18px; opacity: .85; }

  .banner {
    background: #e8f5e9;
    border-bottom: 1px solid #c8e6c9;
    padding: 7px 14px;
    font-size: 11px;
    color: #388e3c;
    text-align: center;
    flex-shrink: 0;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 10px;
    background: #e5ddd5;
    display: flex;
    flex-direction: column;
    gap: 6px;
    scroll-behavior: smooth;
  }
  .chat::-webkit-scrollbar { width: 4px; }
  .chat::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

  .date-divider {
    text-align: center;
    font-size: 11px;
    color: #667781;
    background: #e1f0d8;
    border-radius: 8px;
    padding: 3px 10px;
    align-self: center;
    margin: 4px 0;
  }

  .bubble {
    max-width: 80%;
    padding: 8px 12px 6px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
    position: relative;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .bubble.nina {
    background: #fff;
    align-self: flex-start;
    border-top-left-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .bubble.user {
    background: #d9fdd3;
    align-self: flex-end;
    border-top-right-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .bubble .meta {
    font-size: 10px;
    color: #999;
    text-align: right;
    margin-top: 3px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 3px;
  }
  .bubble.nina .meta { justify-content: flex-end; }
  .check { color: #53bdeb; font-size: 11px; }

  .typing {
    background: #fff;
    align-self: flex-start;
    border-top-left-radius: 2px;
    padding: 10px 14px;
    border-radius: 8px;
    display: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
  .typing span {
    display: inline-block;
    width: 7px; height: 7px;
    background: #aaa;
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  .transfer-card {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #5d4037;
    align-self: center;
    max-width: 92%;
    text-align: center;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  .input-row {
    padding: 8px 10px;
    display: flex;
    gap: 8px;
    align-items: center;
    background: #f0f2f5;
    flex-shrink: 0;
    border-top: 1px solid #e0e0e0;
  }
  .input-row textarea {
    flex: 1;
    border: none;
    background: #fff;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 14px;
    resize: none;
    outline: none;
    max-height: 80px;
    line-height: 1.4;
    font-family: inherit;
  }
  .send-btn {
    width: 42px; height: 42px;
    background: #25d366;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .send-btn:hover { background: #1ebe5e; }
  .send-btn svg { width: 20px; height: 20px; fill: #fff; }

  @media (max-width: 480px) {
    html { height: 100%; }
    body {
      padding: 0;
      align-items: flex-start;
      height: 100%;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }
    .phone {
      border-radius: 0;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 100%;
      max-height: none;
      max-width: none;
    }
  }
</style>
</head>

    };
    _sheetsImgs.push(img);
    img.src = SHEETS_URL + '?' + params;
  } catch(e) {}
}

// ─── UTILITÁRIOS ──────────────────────────────────────────────────────────────
function now() {
  return new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function norm(s) {
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9\s]/g, ' ');
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

// ─── EXTRAÇÃO DO NOME DO PET ──────────────────────────────────────────────────
function extractPetName(msg) {
  var patterns = [
    /(?:para?|pro?|pra?)\s+(?:o\s+|a\s+)?([A-ZÁÉÍÓÚÀÂÊÎÔÛÃÕÇ][a-záéíóúàâêîôûãõç]+)/,
    /(?:do|da)\s+([A-ZÁÉÍÓÚÀÂÊÎÔÛÃÕÇ][a-záéíóúàâêîôûãõç]+)/,
    /(?:meu|minha)\s+([A-ZÁÉÍÓÚÀÂÊÎÔÛÃÕÇ][a-záéíóúàâêîôûãõç]+)/,
    /(?:chama(?:do|da)?\s+|se\s+chama\s+)([A-ZÁÉÍÓÚÀÂÊÎÔÛÃÕÇ][a-záéíóúàâêîôûãõç]+)/,
    /(?:cachorro|gato|gata|cao|pet|bichinho|cadela|filhote)\s+(?:se\s+chama\s+|e\s+o\s+|e\s+a\s+)?([A-ZÁÉÍÓÚÀÂÊÎÔÛÃÕÇ][a-záéíóúàâêîôûãõç]+)/,
    /^([A-ZÁÉÍÓÚÀÂÊÎÔÛÃÕÇ][a-záéíóúàâêîôûãõç]{1,14})$/
  ];
  var ignore = ['voce','aqui','nossa','nisso','nao','sim','mas','com','que','uma','uns','por','pro','pra','nos','ela','ele','seu','meu','sua','minha','ola','oi','boa','dia','tarde','noite','quero','queria','agendar','marcar','consulta','sessao','fisio','gato','cao','cachorro','pet','bom','obrigado','obrigada','como','onde','qual','agendamento','atendimento','fisioterapia','reabilitacao','acupuntura','avaliacao','reavaliacao','retorno','cirurgia','segunda','terca','quarta','quinta','sexta','sabado','domingo','manha','horario','unidade','servico','especie','presencial','domiciliar','modalidade','cachorra','gata','filhote','animal','bichinho','cadela','macho','femea','ola','oi','bom','certo','pode','quero','claro','sim','nao','ok','agendar','marcar'];
  for (var i = 0; i < patterns.length; i++) {
    var match = msg.match(patterns[i]);
    if (match && match[1] && ignore.indexOf(norm(match[1])) === -1 && match[1].length > 2) {
      return match[1];
    }
  }
  return null;
}

// ─── DETECÇÃO DE INTENÇÃO ─────────────────────────────────────────────────────
var FAQ_INTENTS = ['PRECO','PETLOVE','DOMICILIO','SERVICO','UNIDADE','HORARIO_FUNC','INSTAGRAM','PAGAMENTO'];

function detect(msg) {
  var m = norm(msg);
  if (/\b(oi|ola|boa\s*(tarde|noite|manha)|hey|bom\s*dia|oie|ei\b|boa\b)\b/.test(m)) return 'SAUDACAO';
  if (/emergencia|urgencia|nao\s*respira|convulsao|acidente|atropel|bateu|sangrand|desmaiou|envenenou|caiu.*andar|nao\s*se\s*move|parou\s*de\s*respirar|engasgou/.test(m)) return 'EMERGENCIA';
  if (/robo|bot\b|inteligencia|artificial|\bia\b|maquina|sou\s*humana|voce\s*e\s*humana|e\s*pessoa|e\s*real|e\s*gente|automatico/.test(m)) return 'ROBO';
  // HUMANO: só transfere quando a pessoa pede EXPLICITAMENTE para falar com alguém
  // "indicação de veterinário" NÃO deve disparar transferência
  if (/falar\s*com\s*(algu|uma?\s*pessoa|atendente|humano|veterinari|a\s*dani|dani\b|especialista)|chamar\s*(algu|atendente|humano|veterinari)|(quero|preciso|gostaria)\s*(de\s*)?(falar|conversar)\s*com|reclamacao|nao\s*(consigo|to|estou)\s*entend|atendimento\s*human|quero\s*ajuda\s*human|responsavel\s*da|falar\s*com\s*a\s*equipe/.test(m)) return 'HUMANO';
  if (/reiniciar|recomecar|comecar\s*de\s*novo|resetar|zerar|nova\s*conversa/.test(m)) return 'REINICIAR';
  // PRECO: check ANTES de AGENDAR — "quanto custa a consulta?" tem "consulta" mas é dúvida de preço
  if (/preco|valor|quanto\s*(custa|e|cobr|fica|vale)|custo|tabela|pacote|caro|barato|investimento|orcamento/.test(m)) return 'PRECO';
  // Informational queries about services — check BEFORE AGENDAR
  if (/\b(saber\s+sobre|me\s+(fala|conta|explica|diz)\s+(sobre|de)|o\s+que\s+e\s+a?|como\s+funciona|quais\s+(sao|os)\s+servic|voces\s+(tem|oferec|faz)|tem\s+(fisio|acupun|reabilit))\b/.test(m)) return 'SERVICO';
  if (/marcar|agendar|consulta|agendamento|quero\s*ir|queria\s*marcar|quero\s*(fazer|iniciar|comecar)\s*(fisio|sessao|terapia|acupuntura|reabilita)|sessao|retorno|reavaliacao|avaliacao\s*(fisio|veteri)|reabilita/.test(m)) return 'AGENDAR';
  // "fisioterapia" sozinha (sem verbo de agendamento) → info, não agendamento direto
  if (/\b(fisioterapia|fisio\b|hidroterapia)\b/.test(m) && !/marcar|agendar|quero|queria|precis|sessao|retorno|reav/.test(m)) return 'SERVICO';
  if (/petlove|plano\s*de\s*saude|plano\s*saude|convenio|seguro\s*pet/.test(m)) return 'PETLOVE';
  if (/domicil|em\s*casa|atendimento\s*em\s*casa|minha\s*casa|residencia|visita\s*em|vem\s*ate\s*mim|vai\s*ate\s*minha|na\s*minha/.test(m)) return 'DOMICILIO';
  if (/acupuntura|reabilita|servico|tratamento|o\s*que\s*voces\s*faz/.test(m)) return 'SERVICO';
  if (/endereco|onde\s*fica|localizacao|como\s*cheg|unidade|bairro|osasco|madalena|romana|rua|av\b|avenida/.test(m)) return 'UNIDADE';
  if (/horario|funcionamento|quando\s*abr|que\s*horas|que\s*dia|funciona|aberto|fecha/.test(m)) return 'HORARIO_FUNC';
  if (/instagram|insta\b|rede\s*social|redes\s*sociais|seguir|segue\s*a\s*gente/.test(m)) return 'INSTAGRAM';
  if (/pagamento|pagar|pix|cartao|parcel|dinheiro|forma\s*de\s*pag/.test(m)) return 'PAGAMENTO';
  if (/mancando|mancan|claudicando|dor\b|ferido|tumor|vomit|febre|nao\s*(anda|come|bebe|levanta)|lesao|sintoma|doente|machucado|paralisi|paralisa/.test(m)) return 'SINTOMA';
  if (/obrigad|valeu|tchu|ate\s*(logo|mais)|encerr|foi\s*isso|ok\s*obrigad/.test(m)) return 'TCHAU';
  if (/\b(sim|claro|pode|quero|ok\b|bom\b|tudo\s*bem|certo|combinado|isso|exato|perfeito|com\s*certeza|vai|pode\s*ser)\b/.test(m)) return 'AFIRMATIVO';
  if (/\b(nao|nope|negativo|nem\s*a|cancela|desist)\b/.test(m)) return 'NEGATIVO';
  return 'DESCONHECIDO';
}

// ─── RENDERIZAÇÃO ─────────────────────────────────────────────────────────────
function linkify(text) {
  // Convert URLs to clickable links, then convert newlines to <br>
  return text
    .replace(/\n/g, '\n')  // keep newlines for now
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:#075e54;word-break:break-all;">$1</a>')
    .replace(/\n/g, '<br>');
}

function addBubble(text, who) {
  var chat = document.getElementById('chat');
  var typing = document.getElementById('typing');
  var bubble = document.createElement('div');
  bubble.className = 'bubble ' + who;
  var checks = who === 'user' ? '<span class="check">✓✓</span>' : '';
  bubble.innerHTML = linkify(text) + '<div class="meta">' + now() + ' ' + checks + '</div>';
  chat.insertBefore(bubble, typing);
  chat.scrollTop = chat.scrollHeight;
  return bubble;
}

function addTransferCard() {
  var chat = document.getElementById('chat');
  var typing = document.getElementById('typing');
  var card = document.createElement('div');
  card.className = 'transfer-card';
  card.innerHTML = '👤 <span>Transferido para <strong>' + CLINIC.atendente + '</strong>. Ela continuará o atendimento em breve.</span>';
  chat.insertBefore(card, typing);
  chat.scrollTop = chat.scrollHeight;
  document.getElementById('msg-input').placeholder = 'Aguardando ' + CLINIC.atendente + '...';
  document.getElementById('msg-input').disabled = true;
  document.querySelector('.send-btn').disabled = true;
  document.querySelector('.send-btn').style.opacity = '0.5';
}

function showTyping() {
  var t = document.getElementById('typing');
  t.style.display = 'block';
  document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
  document.getElementById('status-text').textContent = 'digitando...';
}

function hideTyping() {
  document.getElementById('typing').style.display = 'none';
  document.getElementById('status-text').textContent = 'online';
}

function ninaReply(text, delay) {
  delay = delay || 1200;
  showTyping();
  setTimeout(function() {
    hideTyping();
    addBubble(text, 'nina');
  }, delay);
}

function ninaReplies(messages) {
  // Send multiple messages in sequence
  var delay = 0;
  messages.forEach(function(msg, i) {
    var d = 800 + Math.min(400 + msg.length * 16, 2000);
    delay += (i === 0 ? 0 : d);
    (function(m, del) {
      setTimeout(function() {
        showTyping();
        setTimeout(function() {
          hideTyping();
          addBubble(m, 'nina');
        }, Math.min(400 + m.length * 18, 2200));
      }, del);
    })(msg, delay);
    delay += Math.min(400 + msg.length * 18, 2200);
  });
}

// ─── MOTOR DE ESTADOS ─────────────────────────────────────────────────────────
function getReply(msg) {
  if (transferred) return null;

  var intent = detect(msg);
  var m = norm(msg);

  // ── GLOBAIS (qualquer estado) ────────────────────────────────────────────────
  // Nome próprio (pet/tutor) é texto livre: "Maria", "Julia", "Sofia" etc. não podem
  // ser sequestrados por intents globais como ROBO/HUMANO/TCHAU. EMERGENCIA e
  // REINICIAR continuam valendo em qualquer estado (segurança / controle do usuário).
  var NAME_CAPTURE_STATES = ['AGUARDANDO_NOME_ANIMAL', 'AGUARDANDO_NOME_TUTOR'];
  var isNameCapture = NAME_CAPTURE_STATES.indexOf(state) !== -1;

  if (intent === 'EMERGENCIA') {
    return 'Meu Deus, que susto! 😱 Isso é urgência — leva ele imediatamente para uma clínica de emergência veterinária. Não perde tempo aqui no chat, vai direto! 🙏';
  }

  if (intent === 'ROBO' && !isNameCapture) {
    return 'Sim, sou uma assistente virtual da FisiovetClass 😊 Mas estou aqui pra te ajudar de verdade com o que você precisar. Se preferir falar com uma pessoa a qualquer momento, é só me pedir que eu chamo a ' + CLINIC.atendente + ' da nossa equipe pra te atender.';
  }

  if (intent === 'HUMANO' && !isNameCapture) {
    setTimeout(function() { addTransferCard(); }, 1800);
    transferred = true;
    return 'Claro, sem problema! Vou chamar a ' + CLINIC.atendente + ' da nossa equipe pra continuar te atendendo. Um momento 😊';
  }

  if (intent === 'TCHAU' && !isNameCapture) {
    return 'Disponha! 😊 Qualquer coisa é só chamar. Até mais, cuida bem do seu pet! 🐾';
  }

  if (intent === 'REINICIAR') {
    resetCtx();
    state = 'MENU';
    return 'Claro! Vamos começar do zero 😊 Como posso te ajudar?';
  }

  // ── INTERRUPÇÃO POR FAQ no meio de um fluxo ──────────────────────────────────
  var isInFlow = ['AGUARDANDO_NOME_ANIMAL','AGUARDANDO_ESPECIE','AGUARDANDO_NOME_TUTOR',
    'AGUARDANDO_NOVO_OU_ANTIGO','AGUARDANDO_MODALIDADE','AGUARDANDO_COMO_CONHECEU',
    'AGUARDANDO_SERVICO','AGUARDANDO_UNIDADE','AGUARDANDO_ENDERECO',
    'AGUARDANDO_PAGAMENTO','AGUARDANDO_PLANO_PETLOVE','AGUARDANDO_CPF_CHIP',
    'AGUARDANDO_HORARIO','AGUARDANDO_CONFIRMACAO'].indexOf(state) !== -1;

  // Não interrompe com FAQ se a intenção é exatamente o que o estado está aguardando
  var STATE_EXPECTED = {
    'AGUARDANDO_UNIDADE':    ['UNIDADE'],
    'AGUARDANDO_MODALIDADE': ['DOMICILIO', 'UNIDADE'],  // 'unidades' = resposta válida (presencial)
    'AGUARDANDO_SERVICO':    ['SERVICO', 'AGENDAR'],
    'AGUARDANDO_HORARIO':    ['HORARIO_FUNC'],
    // AGUARDANDO_COMO_CONHECEU: resposta é livre ("instagram", "indicação de veterinário", etc.)
    // Marca como esperado tudo EXCETO PRECO — preço genuíno ainda deve ser respondido a qualquer hora
    'AGUARDANDO_COMO_CONHECEU': ['INSTAGRAM', 'DOMICILIO', 'SERVICO', 'UNIDADE', 'HORARIO_FUNC', 'PAGAMENTO', 'PETLOVE'],
    // v7: respostas livres (endereço, nome do plano, CPF/chip) — só PRECO interrompe
    'AGUARDANDO_ENDERECO':      ['INSTAGRAM', 'DOMICILIO', 'SERVICO', 'UNIDADE', 'HORARIO_FUNC', 'PAGAMENTO', 'PETLOVE'],
    'AGUARDANDO_PAGAMENTO':     ['PETLOVE', 'PAGAMENTO'],
    'AGUARDANDO_PLANO_PETLOVE': ['INSTAGRAM', 'DOMICILIO', 'SERVICO', 'UNIDADE', 'HORARIO_FUNC', 'PAGAMENTO', 'PETLOVE'],
    'AGUARDANDO_CPF_CHIP':      ['INSTAGRAM', 'DOMICILIO', 'SERVICO', 'UNIDADE', 'HORARIO_FUNC', 'PAGAMENTO', 'PETLOVE']
  };
  var expectedNow = STATE_EXPECTED[state] || [];

  // v7: cliente mencionou Petlove em qualquer momento → marca como paciente Petlove
  if (intent === 'PETLOVE' && state !== 'AGUARDANDO_PAGAMENTO') ctx.pagamento = 'Petlove';

  if (isInFlow && FAQ_INTENTS.indexOf(intent) !== -1 && expectedNow.indexOf(intent) === -1) {
    var faq = faqReply(intent);
    if (faq) {
      // Responde a FAQ e lembra de onde estava
      lastFlowState = state;
      setTimeout(function() {
        ninaReply('Continuando o agendamento... 😊 ' + getFlowPrompt(), 1000);
      }, 2800);
      return faq;
    }
  }

  // ── MÁQUINA DE ESTADOS ───────────────────────────────────────────────────────
  switch(state) {

    case 'INICIAL': {
      var petName = extractPetName(msg);
      if (petName) ctx.animal = petName;

      var greeting = 'Olá! Meu nome é Nina, sou atendente virtual da FisiovetClass 💚\n\n';

      if (intent === 'SAUDACAO' || msg.trim().length <= 4) {
        state = 'MENU';
        return greeting + 'Seja bem-vindo(a)! Como posso te ajudar hoje?';
      }

      state = 'MENU';

      // Mensagem informacional no primeiro contato → responde e convida para agendar
      if (intent === 'SERVICO' || intent === 'PRECO' || intent === 'UNIDADE' || intent === 'HORARIO_FUNC' || intent === 'PAGAMENTO' || intent === 'PETLOVE') {
        var faqR = faqReply(intent);
        if (faqR) return greeting + faqR;
      }

      if (intent === 'SINTOMA') {
        return greeting + 'Que preocupante! 😟 Esses sintomas precisam de uma avaliação presencial para entender o que está acontecendo — cada caso é único.\n\nQuer que eu verifique um horário o quanto antes?';
      }

      if (intent === 'AGENDAR' && ctx.animal) {
        state = 'AGUARDANDO_ESPECIE';
        return greeting + 'Já vi que é para o(a) ' + ctx.animal + '! 😊 É cachorro, gato ou outra espécie?';
      }

      if (intent === 'AGENDAR') {
        state = 'AGUARDANDO_NOME_ANIMAL';
        return greeting + 'Claro, vamos agendar! 😊 Qual o nome do seu bichinho?';
      }

      // Mensagem genérica / não reconhecida no primeiro contato → apresenta opções
      return greeting + 'Como posso te ajudar?\n\n📅 Agendar atendimento\n💰 Preços e serviços\n📍 Nossas unidades\n🏠 Atendimento domiciliar\n💳 Formas de pagamento';
    }

    case 'MENU':
      return processMenu(msg, intent, false);

    // ── NOME DO ANIMAL ───────────────────────────────────────────────────────
    case 'AGUARDANDO_NOME_ANIMAL': {
      var NOMES_INVALIDOS = ['sim','nao','ok','oi','ola','quero','pode','bom','certo','claro',
        'nope','talvez','sei','la','ne','entao','assim','aqui','isso','nada',
        'agendamento','agendar','atendimento','marcar','consulta','fisioterapia','sessao',
        'tarde','manha','presencial','domiciliar','cachorro','gato','gata','cao','cadela',
        'filhote','animal','bichinho','avaliacao','reavaliacao','acupuntura','reabilitacao'];
      var rawNome = msg.trim();
      var candidato = extractPetName(rawNome) || rawNome.split(/\s+/)[0];
      var candidatoNorm = norm(candidato || '');
      if (!candidato || candidato.length < 2 || NOMES_INVALIDOS.indexOf(candidatoNorm) !== -1 || /^\d+$/.test(candidato)) {
        return 'Para continuar o agendamento preciso saber o nome do seu pet 🐾 Qual é o nome dele(a)?';
      }
      ctx.animal = candidato.charAt(0).toUpperCase() + candidato.slice(1).toLowerCase();
      state = 'AGUARDANDO_ESPECIE';
      return pick([
        'Que nome fofo! 😄 O(a) ' + ctx.animal + ' é cachorro, gato ou outra espécie?',
        'Adorei! 😊 O(a) ' + ctx.animal + ' é cachorro, gato ou outra espécie?'
      ]);
    }

    // ── ESPÉCIE ───────────────────────────────────────────────────────────────
    case 'AGUARDANDO_ESPECIE': {
      var mn = norm(msg);
      if (/\bgat(o|a|inho|inha)?\b/.test(mn)) ctx.especie = 'gato';
      else if (/\b(cachorro|cao|cadela|caozinho|dog|vira.?lata|labrador|poodle|bulldog|golden|pastor|husky|yorkie|shih|maltes|lulu|daschund|dachshund|pitbull|rottweiler|beagle|boxer)\b/.test(mn)) ctx.especie = 'cachorro';
      else if (/\b(coelho|hamster|porquinho|ave|passaro|papagaio|calopsita|periquito|tartaruga|peixe|ferret|furão)\b/.test(mn)) ctx.especie = msg.trim();
      else if (msg.trim().length > 0) ctx.especie = msg.trim(); // aceita qualquer coisa
      state = 'AGUARDANDO_NOME_TUTOR';
      var emojiPet = ctx.especie === 'gato' ? '🐱' : ctx.especie === 'cachorro' ? '🐶' : '🐾';
      return 'Perfeito! ' + emojiPet + ' E qual é o seu nome?';
    }

    // ── NOME DO TUTOR ─────────────────────────────────────────────────────────
    case 'AGUARDANDO_NOME_TUTOR': {
      var raw = msg.trim().split(' ')[0];
      ctx.tutor = raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
      state = 'AGUARDANDO_NOVO_OU_ANTIGO';
      return 'Prazer, ' + ctx.tutor + '! 😊 É a primeira vez que vocês vêm à FisiovetClass, ou já são nossos clientes?';
    }

    // ── NOVO OU RECORRENTE ────────────────────────────────────────────────────
    case 'AGUARDANDO_NOVO_OU_ANTIGO': {
      var mn2 = norm(msg);
      // Explicitamente novo cliente
      var novo = /primeiro|primeira|nova|nunca|nao\s*(fui|vim|conhec|fiz|era)|nao\s*sao|ainda\s*nao|estreia|debut|inedito|nenhuma\s*vez/.test(mn2);
      // Explicitamente cliente antigo/recorrente
      var antigo = /ja\s*(sou|somos|fui|vim|conhec|fiz|era)|retorn|segunda|terceira|quarta|voltando|recorrent|client|sempre|frequen|costumo|conheo|ja\s*fui/.test(mn2);
      // "sim" como resposta à pergunta "é a primeira vez?" → novo cliente
      if (!novo && !antigo) {
        if (/\b(sim|e\s*sim|exato|isso|correto|e\s*verdade)\b/.test(mn2)) { novo = true; }
        // "não" → cliente antigo (já foi antes)
        else if (/\b(nao|nope|negativo|nah|ja)\b/.test(mn2)) { antigo = true; }
      }
      // Se ainda ambíguo, perguntar de novo
      if (!novo && !antigo) {
        return 'Só para eu entender: é a primeira vez que o(a) ' + (ctx.animal || 'pet') + ' vem à FisiovetClass? 😊';
      }
      ctx.novoCliente = novo || !antigo;
      state = 'AGUARDANDO_MODALIDADE';
      var prefix = ctx.novoCliente ? 'Que ótimo receber vocês! 🎉\n\n' : 'Bem-vindos de volta! 😊\n\n';
      return prefix + ctx.tutor + ', você prefere atendimento presencial em uma das nossas unidades ou atendimento domiciliar? 🏥🏠';
    }

    // ── MODALIDADE ────────────────────────────────────────────────────────────
    case 'AGUARDANDO_MODALIDADE': {
      var mn3 = norm(msg);
      var isDomiciliar = /domicil|em\s*casa|residencia|minha\s*casa|venha|visita\s*(em\s*casa|a\s*domicilio)|na\s*minha/.test(mn3) || intent === 'DOMICILIO';
      var isPresencial = /presenc|clinica|unidade|levar|ir\s*(la|ate|a\s*clinica)|pessoal|la\s*(na|em)|na\s*(clinica|unidade)|osasco|madalena|romana/.test(mn3) || intent === 'UNIDADE';
      if (!isDomiciliar && !isPresencial) {
        return 'Pode me dizer se você prefere trazer o(a) ' + (ctx.animal || 'pet') + ' até uma das nossas unidades, ou prefere atendimento domiciliar (a gente vai até você em casa)? 🏥🏠';
      }
      ctx.modalidade = isDomiciliar ? 'Domiciliar' : 'Presencial';
      if (ctx.novoCliente) {
        state = 'AGUARDANDO_COMO_CONHECEU';
        return 'Como você ficou sabendo da FisiovetClass?\n\n• Instagram\n• Indicação de amigo\n• Indicação de veterinário\n• Google\n• Outro';
      } else {
        state = 'AGUARDANDO_SERVICO';
        return ctx.tutor + ', que tipo de atendimento o(a) ' + ctx.animal + ' precisa?\n\n• Reavaliação\n• Sessão de fisioterapia\n• Reabilitação pós-cirúrgica\n• Acupuntura';
      }
    }

    // ── COMO NOS CONHECEU ─────────────────────────────────────────────────────
    case 'AGUARDANDO_COMO_CONHECEU': {
      ctx.comoConheceu = msg.trim();
      var mn4 = norm(msg);
      var veioPeloInsta = /instagram|insta\b/.test(mn4);
      // Avaliação obrigatória para 1ª vez
      ctx.servico = 'Avaliação';
      var baseMsg = 'Obrigada por nos contar! 💚\n\nComo é a primeira vez do(a) ' + ctx.animal + ', vamos começar com uma avaliação — é o profissional que vai definir o melhor tratamento.';
      var instaHint = veioPeloInsta ? '' : '\n\nAproveitando, nos acompanhe no Instagram! Por lá você vai ver muito conteúdo bacana sobre saúde animal 🐾 ' + CLINIC.instagram;
      if (ctx.modalidade === 'Domiciliar') {
        state = 'AGUARDANDO_ENDERECO';
        return baseMsg + instaHint + '\n\n' + PERGUNTA_ENDERECO;
      } else {
        state = 'AGUARDANDO_UNIDADE';
        return baseMsg + instaHint + '\n\nQual unidade fica mais perto de você?\n\n📍 Osasco\n📍 Vila Madalena\n📍 Vila Romana';
      }
    }

    // ── SERVIÇO (cliente recorrente) ──────────────────────────────────────────
    case 'AGUARDANDO_SERVICO': {
      ctx.servico = msg.trim();
      if (ctx.modalidade === 'Domiciliar') {
        state = 'AGUARDANDO_ENDERECO';
        return 'Anotei! 😊 ' + PERGUNTA_ENDERECO;
      } else {
        state = 'AGUARDANDO_UNIDADE';
        return 'Anotei! 😊 Qual unidade fica mais perto de você?\n\n📍 Osasco\n📍 Vila Madalena\n📍 Vila Romana';
      }
    }

    // ── UNIDADE ───────────────────────────────────────────────────────────────
    case 'AGUARDANDO_UNIDADE': {
      var mUn = norm(msg);
      // Paciente Petlove que escolheu Vila Madalena → Petlove não é aceito lá
      if (ctx.pagamento === 'Petlove' && /particular/.test(mUn)) {
        ctx.pagamento = 'Particular';
        ctx.unidade = ctx.unidade || 'Vila Madalena';
        state = 'AGUARDANDO_HORARIO';
        return 'Combinado, fica como particular na Vila Madalena 😊 Qual horário funciona melhor pra você? Manhã ou tarde?';
      }
      ctx.unidade = /osasco/.test(mUn) ? 'Osasco' : /madalena/.test(mUn) ? 'Vila Madalena' : /romana/.test(mUn) ? 'Vila Romana' : msg.trim();
      if (ctx.unidade === 'Vila Madalena' && ctx.pagamento === 'Petlove') {
        return 'Só um detalhe: na unidade Vila Madalena o plano Petlove não é aceito 😕\n\nPrefere ir em Osasco ou Vila Romana (que aceitam Petlove), ou seguir na Vila Madalena como particular?';
      }
      if (ctx.unidade === 'Vila Madalena') {
        ctx.pagamento = 'Particular';
        state = 'AGUARDANDO_HORARIO';
        return 'Anotei! 😊 Na unidade Vila Madalena aceitamos PIX, cartão de crédito e dinheiro (o plano Petlove não é aceito nessa unidade).\n\nQual horário funciona melhor pra você? Manhã ou tarde?';
      }
      return proximoPassoPagamento('Anotei! 💚 ');
    }

    // ── ENDEREÇO (domiciliar) — v7 ────────────────────────────────────────────
    case 'AGUARDANDO_ENDERECO': {
      var cepMatch = msg.match(/\b(\d{5})-?(\d{3})\b/);
      var semCep = msg.replace(/\b\d{5}-?\d{3}\b/, '').replace(/\bcep\b[:\s]*/i, '').trim().replace(/[,\-–\s]+$/, '');
      if (semCep.length >= 6) ctx.endereco = ctx.endereco ? ctx.endereco + ', ' + semCep : semCep;
      if (cepMatch) ctx.cep = cepMatch[1] + '-' + cepMatch[2];
      if (!ctx.endereco) {
        return 'Me passa o endereço completo (rua, número, complemento e bairro) junto com o CEP? 🏠';
      }
      if (!ctx.cep) {
        return 'Anotei o endereço! 😊 Me passa também o CEP?';
      }
      return proximoPassoPagamento('Obrigada! 🏠 A equipe vai conferir se atendemos na sua região e te passa o orçamento do atendimento domiciliar.\n\n');
    }

    // ── PARTICULAR OU PETLOVE — v7 ────────────────────────────────────────────
    case 'AGUARDANDO_PAGAMENTO': {
      var mPg = norm(msg);
      if (intent === 'PETLOVE' || /\b(plano|convenio)\b/.test(mPg)) {
        ctx.pagamento = 'Petlove';
        state = 'AGUARDANDO_PLANO_PETLOVE';
        return PERGUNTA_PLANO;
      }
      if (/particular|pix|cartao|dinheiro|debito|credito|nao\s*tenho|sem\s*plano|nao\b/.test(mPg)) {
        ctx.pagamento = 'Particular';
        state = 'AGUARDANDO_HORARIO';
        return 'Anotei! 😊 Qual horário funciona melhor pra você? Manhã ou tarde?';
      }
      return 'Só pra eu anotar certinho: o atendimento vai ser particular ou pelo plano Petlove? 😊';
    }

    // ── QUAL PLANO PETLOVE — v7 ───────────────────────────────────────────────
    case 'AGUARDANDO_PLANO_PETLOVE': {
      ctx.planoPetlove = msg.trim();
      state = 'AGUARDANDO_CPF_CHIP';
      return PERGUNTA_CPF_CHIP;
    }

    // ── CPF OU MICROCHIP — v7 ─────────────────────────────────────────────────
    case 'AGUARDANDO_CPF_CHIP': {
      var dig = msg.replace(/\D/g, '');
      if (dig.length >= 9) {
        var tipo = dig.length === 11 ? 'CPF' : dig.length === 15 ? 'Microchip' : 'CPF/Microchip';
        ctx.cpfChip = tipo + ': ' + dig;
        state = 'AGUARDANDO_HORARIO';
        return 'Anotado! ✅ A ' + CLINIC.atendente + ' vai conferir na Petlove se o(a) ' + (ctx.animal || 'pet') + ' tem direito ao atendimento.\n\nQual horário funciona melhor pra você? Manhã ou tarde?';
      }
      if (/\b(nao|sei|tenho|depois|agora)\b/.test(norm(msg))) {
        ctx.cpfChip = 'não informado';
        state = 'AGUARDANDO_HORARIO';
        return 'Sem problema! A ' + CLINIC.atendente + ' confirma isso com você depois 😊\n\nQual horário funciona melhor pra você? Manhã ou tarde?';
      }
      return 'Pode me mandar só os números do seu CPF ou do microchip do(a) ' + (ctx.animal || 'pet') + '? 😊';
    }

    // ── HORÁRIO ───────────────────────────────────────────────────────────────
    case 'AGUARDANDO_HORARIO': {
      ctx.horario_pref = msg.trim();
      state = 'AGUARDANDO_CONFIRMACAO';
      var resumo = '\n🐾 Pet: ' + ctx.animal;
      if (ctx.especie) resumo += ' (' + ctx.especie + ')';
      resumo += '\n👤 Tutor: ' + (ctx.tutor || '—');
      resumo += '\n🏥 Modalidade: ' + (ctx.modalidade || 'Presencial');
      if (ctx.unidade) resumo += '\n📍 Unidade: ' + ctx.unidade;
      if (ctx.endereco) resumo += '\n🏠 Endereço: ' + ctx.endereco + (ctx.cep ? ' — CEP ' + ctx.cep : '');
      resumo += '\n💆 Serviço: ' + (ctx.servico || 'Avaliação');
      if (ctx.pagamento) resumo += '\n💳 Pagamento: ' + ctx.pagamento;
      if (ctx.planoPetlove) resumo += '\n📋 Plano Petlove: ' + ctx.planoPetlove;
      if (ctx.cpfChip) resumo += '\n🔎 ' + ctx.cpfChip;
      resumo += '\n🕐 Preferência: ' + ctx.horario_pref;
      if (ctx.comoConheceu) resumo += '\n📣 Como nos conheceu: ' + ctx.comoConheceu;
      return 'Deixa eu anotar o pedido:' + resumo + '\n\nVou verificar a disponibilidade com a nossa equipe e te retorno em breve para confirmar o horário. Tudo certo?';
    }

    // ── CONFIRMAÇÃO ───────────────────────────────────────────────────────────
    case 'AGUARDANDO_CONFIRMACAO': {
      var mn5 = norm(msg);
      if (/nao|nope|nada|cancela|errou|errado|muda|corrig/.test(mn5)) {
        resetCtx();
        state = 'MENU';
        return 'Tudo bem, vamos recomeçar! 😊 Pode me dizer o que precisa mudar?';
      }
      saveToSheets(ctx);
      resetCtx();
      state = 'MENU';
      return pick([
        'Perfeito! ✅ Assim que confirmarmos com a equipe, te aviso aqui mesmo 😊 Posso te ajudar em mais alguma coisa?',
        'Ótimo! 💚 Vou verificar e te confirmo o horário em breve. Mais alguma coisa?'
      ]);
    }

    default:
      state = 'MENU';
      return processMenu(msg, intent, false);
  }
}

// ─── v7: PETLOVE / DOMICILIAR ─────────────────────────────────────────────────
var PERGUNTA_ENDERECO = 'Pra atendimento em casa, me passa o endereço completo com CEP? 🏠 Assim a gente confere se atende na sua região e já te passa o orçamento.';
var PERGUNTA_PLANO = 'Qual é o seu plano da Petlove? Pergunto porque alguns planos não incluem fisioterapia 😊';
var PERGUNTA_CPF_CHIP = 'Perfeito! Pode me passar o seu CPF ou o número do microchip do pet? Com isso a ' + CLINIC.atendente + ' já confere na Petlove se ele tem direito ao atendimento.';

// Depois da unidade/endereço: se já sabemos que é Petlove, pula direto pro plano
function proximoPassoPagamento(prefixo) {
  if (ctx.pagamento === 'Petlove') {
    state = 'AGUARDANDO_PLANO_PETLOVE';
    return prefixo + 'Vi que você vai usar a Petlove. ' + PERGUNTA_PLANO;
  }
  state = 'AGUARDANDO_PAGAMENTO';
  return prefixo + 'O atendimento vai ser particular ou pelo plano Petlove?';
}

// ─── RETOMA PROMPT DO FLUXO ───────────────────────────────────────────────────
function getFlowPrompt() {
  switch(state) {
    case 'AGUARDANDO_NOME_ANIMAL': return 'Qual o nome do seu bichinho?';
    case 'AGUARDANDO_ESPECIE': return 'O(a) ' + (ctx.animal||'pet') + ' é cachorro, gato ou outra espécie?';
    case 'AGUARDANDO_NOME_TUTOR': return 'Qual é o seu nome?';
    case 'AGUARDANDO_NOVO_OU_ANTIGO': return 'É a primeira vez na FisiovetClass ou já são nossos clientes?';
    case 'AGUARDANDO_MODALIDADE': return 'Você prefere atendimento presencial ou domiciliar?';
    case 'AGUARDANDO_COMO_CONHECEU': return 'Como você ficou sabendo da FisiovetClass?\n• Instagram\n• Indicação de amigo\n• Indicação de veterinário\n• Google\n• Outro';
    case 'AGUARDANDO_SERVICO': return 'Que tipo de atendimento o(a) ' + (ctx.animal||'pet') + ' precisa?\n• Reavaliação\n• Sessão de fisioterapia\n• Reabilitação pós-cirúrgica\n• Acupuntura';
    case 'AGUARDANDO_UNIDADE': return 'Qual unidade fica mais perto de você?\n📍 Osasco\n📍 Vila Madalena\n📍 Vila Romana';
    case 'AGUARDANDO_ENDERECO': return PERGUNTA_ENDERECO;
    case 'AGUARDANDO_PAGAMENTO': return 'O atendimento vai ser particular ou pelo plano Petlove?';
    case 'AGUARDANDO_PLANO_PETLOVE': return PERGUNTA_PLANO;
    case 'AGUARDANDO_CPF_CHIP': return PERGUNTA_CPF_CHIP;
    case 'AGUARDANDO_HORARIO': return 'Qual horário funciona melhor? Manhã ou tarde?';
    default: return 'Como posso te ajudar?';
  }
}

// ─── MENU PRINCIPAL ───────────────────────────────────────────────────────────
function processMenu(msg, intent, isFirst) {
  var greeting = isFirst ? 'Olá! Meu nome é Nina, sou atendente virtual da FisiovetClass 💚\n\n' : '';

  switch(intent) {
    case 'AGENDAR': {
      if (!ctx.animal) {
        var pet = extractPetName(msg);
        if (pet) ctx.animal = pet;
      }
      if (ctx.animal) {
        state = 'AGUARDANDO_ESPECIE';
        return greeting + 'Claro! Vi que é para o(a) ' + ctx.animal + ' 😊 É cachorro, gato ou outra espécie?';
      }
      state = 'AGUARDANDO_NOME_ANIMAL';
      return greeting + 'Claro, vamos agendar! 😊 Qual o nome do seu bichinho?';
    }

    case 'PRECO':
    case 'PETLOVE':
    case 'DOMICILIO':
    case 'SERVICO':
    case 'UNIDADE':
    case 'HORARIO_FUNC':
    case 'INSTAGRAM':
    case 'PAGAMENTO': {
      if (intent === 'PETLOVE') ctx.pagamento = 'Petlove';
      var faq = faqReply(intent);
      return greeting + (faq || 'Como posso te ajudar?');
    }

    case 'SINTOMA':
      return greeting + 'Que preocupante! 😟 Esses sintomas precisam de uma avaliação presencial para entender o que está acontecendo — cada caso é único.\n\nQuer que eu verifique um horário o quanto antes?';

    case 'AFIRMATIVO':
      state = 'AGUARDANDO_NOME_ANIMAL';
      return 'Ótimo! 😊 Qual o nome do seu pet?';

    default:
      return greeting + 'Como posso te ajudar?\n\n📅 Agendar atendimento\n💰 Preços e serviços\n📍 Nossas unidades\n🏠 Atendimento domiciliar\n💳 Formas de pagamento';
  }
}

// ─── ENVIO ────────────────────────────────────────────────────────────────────
function sendMessage() {
  var input = document.getElementById('msg-input');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  autoResize(input);
  addBubble(text, 'user');
  input.focus();
  if (transferred) return;
  var reply = getReply(text);
  if (reply) ninaReply(reply, Math.min(700 + reply.length * 16, 2800));
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

// ─── INICIALIZAÇÃO ────────────────────────────────────────────────────────────
window.addEventListener('load', function() {
  setTimeout(function() {
    ninaReply('Olá! Meu nome é Nina, sou atendente virtual da Fisiovetclass e vou ajudar no que precisar 💚\n\nSeja bem-vindo(a) à FisiovetClass! Como posso te ajudar hoje?', 800);
    state = 'MENU';
  }, 600);

  // ── Teclado virtual mobile: mantém o chat fixo como WhatsApp ──
  var chat = document.getElementById('chat');
  var inputEl = document.getElementById('msg-input');
  var phone = document.querySelector('.phone');

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  inputEl.addEventListener('focus', function() {
    setTimeout(scrollToBottom, 350);
  });

  if (window.visualViewport) {
    function adjustForKeyboard() {
      var vvh = window.visualViewport.height;
      var vvt = window.visualViewport.offsetTop || 0;
      phone.style.height = vvh + 'px';
      phone.style.top = vvt + 'px';
      scrollToBottom();
    }
    window.visualViewport.addEventListener('resize', adjustForKeyboard);
    window.visualViewport.addEventListener('scroll', adjustForKeyboard);
  }
});
</script>
